name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time env only.
      #
      # `clientEnv` in src/lib/env.ts is parsed eagerly, so `next build` fails
      # without these two. They are deliberately fake: CI must never hold real
      # project credentials, and nothing in the build talks to Supabase.
      #
      # Server env is parsed lazily via serverEnv(), so DATABASE_URL and friends
      # are not needed to build. The values below exist only to satisfy schema
      # validation if something evaluates it.
      NEXT_PUBLIC_SUPABASE_URL: https://example-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
      # Keep Next's telemetry out of CI logs.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` floor in package.json; Next 16 requires
          # 20.9+.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # `typecheck` runs `next typegen` first, because the PageProps/LayoutProps
      # type helpers live in the gitignored .next/types and do not exist on a
      # fresh clone.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Proves the generated SQL actually runs against a real PostGIS database,
    # rather than only that it was generated. This is the job that would have
    # caught both geometry bugs: the quoted `geography(Point, 4326)` type and
    # the dropped SRID.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hashtagstay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hashtagstay_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/hashtagstay_ci
      AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
      NEXT_PUBLIC_SUPABASE_URL: https://example-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Re-apply to prove idempotency
        # A second run must be a no-op. If it is not, the migration journal and
        # the database have diverged.
        run: npm run db:migrate

      - name: Assert schema drift is committed
        # `db:generate` after a clean checkout must produce nothing. A diff here
        # means someone changed the schema without generating the migration.
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a generated migration:"
            git status --porcelain drizzle
            git diff -- drizzle | head -100
            exit 1
          fi
          echo "No uncommitted schema drift."

# TODO(M2): add a Lighthouse budget job (perf and SEO >= 90 mobile) on /, a city
# page and a listing page. Deferred until those pages exist — gating on the
# scaffold page would assert nothing about the product.
