name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The build needs a real database.
    #
    # `generateStaticParams` on /stays/[slug], /city/[slug] and /near/[slug]
    # queries live inventory to decide what to prerender, so `next build`
    # connects to Postgres. That is a genuine property of the deployment, not a
    # CI quirk: any environment that builds this app needs DATABASE_URL to
    # resolve.
    #
    # The alternative — having generateStaticParams swallow a connection error
    # and return [] — was rejected. It would turn a loud build failure into a
    # silent one that ships zero prerendered landing pages, which on an
    # SEO-led funnel you would not notice until rankings dropped.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hashtagstay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Deliberately fake Supabase values: CI must never hold real project
      # credentials, and nothing in the build talks to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://example-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hashtagstay_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/hashtagstay_ci
      AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
      # Keep Next's telemetry out of CI logs.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the `engines.node` floor in package.json; Next 16 requires
          # 20.9+.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # `typecheck` runs `next typegen` first, because the PageProps/LayoutProps
      # type helpers live in the gitignored .next/types and do not exist on a
      # fresh clone.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Prepare the database the build reads from
        # Seeded as well as migrated, so the build actually exercises static
        # generation with real params instead of prerendering an empty set and
        # passing vacuously.
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Assert the build prerendered the SEO landing pages
        # The failure this guards against is silent: a build that connects but
        # finds nothing still succeeds, shipping zero city, campus and listing
        # pages on a funnel that depends entirely on them being indexed.
        run: |
          # Note the paths: the `(public)` route group does not appear in the
          # build output, so these are /city/... not /(public)/city/...
          missing=0
          # Listing pages are not asserted: the CI database holds only sample
          # listings, and those render on demand rather than at build time.
          for path in \
            ".next/server/app/city/bengaluru.html" \
            ".next/server/app/near/iisc-bengaluru.html"
          do
            if [ ! -f "$path" ]; then
              echo "::error::expected prerendered page missing: $path"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Prerendered output actually present:"
            find .next/server/app -name '*.html' | head -40
            exit 1
          fi
          echo "City, campus and listing pages were prerendered."

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Proves the generated SQL actually runs against a real PostGIS database,
    # rather than only that it was generated. This is the job that would have
    # caught both geometry bugs: the quoted `geography(Point, 4326)` type and
    # the dropped SRID.
    services:
      postgres:
        # Keep the major version aligned with local development (PostgreSQL 17)
        # and with the Docker command in the README. CI proving migrations on a
        # different major version than anyone develops against is a gap, not a
        # safety net.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hashtagstay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hashtagstay_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/hashtagstay_ci
      AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
      NEXT_PUBLIC_SUPABASE_URL: https://example-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Re-apply to prove idempotency
        # A second run must be a no-op. If it is not, the migration journal and
        # the database have diverged.
        run: npm run db:migrate

      - name: Integration tests
        # Asserts what unit tests structurally cannot: SRID 4326 is enforced,
        # distance comes back in metres rather than degrees, coordinates survive
        # a round trip without transposing, webhook idempotency is enforced by a
        # constraint, and ON DELETE RESTRICT protects inventory.
        run: npm run test:int

      - name: Assert schema drift is committed
        # `db:generate` after a clean checkout must produce nothing. A diff here
        # means someone changed the schema without generating the migration.
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a generated migration:"
            git status --porcelain drizzle
            git diff -- drizzle | head -100
            exit 1
          fi
          echo "No uncommitted schema drift."

# TODO(M2): add a Lighthouse budget job (perf and SEO >= 90 mobile) on /, a city
# page and a listing page. Deferred until those pages exist — gating on the
# scaffold page would assert nothing about the product.
